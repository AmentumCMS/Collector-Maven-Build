name: Maven Collector - Other Branch
run-name: ${{ github.actor }} is Collecting Maven-ness (${{ github.ref_name }})🚀

on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_dispatch:

jobs:
  Date:
    runs-on: ubuntu-latest
    outputs:
      Date: ${{ steps.DATE.outputs.DATE }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo -n "Setting Date in "
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_OUTPUT"
          echo "Values: $(cat "$GITHUB_OUTPUT")"

      - name: Display Envars
        run: env

  UpdateVers:
    runs-on: ubuntu-latest
    needs: [ Date ]
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAVEN_REPO: ${{ github.workspace }}/.collector-m2/repository
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare isolated Maven repository
        run: |
          rm -rf "${MAVEN_REPO}"
          mkdir -p "${MAVEN_REPO}"

      - name: Set up git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Show available non-major stable Maven updates
        run: |
          mvn -Dmaven.repo.local="${MAVEN_REPO}" \
            --no-transfer-progress -DskipTests=true -s settings.xml -B \
            versions:display-parent-updates \
            versions:display-property-updates \
            versions:display-dependency-updates \
            versions:display-plugin-updates \
            -DallowMajorUpdates=false \
            -DallowSnapshots=false \
            -DignoredVersions='.*-M.*,.*-RC.*,.*-alpha.*,.*-beta.*,.*-SNAPSHOT' \
            | tee maven-version-updates.txt

      - name: Advance non-major Maven versions
        run: |
          set -eux

          COMMON_MVN_ARGS=(
            --no-transfer-progress
            -Dmaven.repo.local="${MAVEN_REPO}"
            -DskipTests=true
            -s settings.xml
            -B
          )

          COMMON_UPDATE_ARGS=(
            -DallowMajorUpdates=false
            -DallowMinorUpdates=true
            -DallowIncrementalUpdates=true
            -DallowSnapshots=false
            -DgenerateBackupPoms=false
            -DignoredVersions='.*-M.*,.*-RC.*,.*-alpha.*,.*-beta.*,.*-SNAPSHOT'
          )

          mvn "${COMMON_MVN_ARGS[@]}" \
            versions:update-parent \
            -DallowMajorUpdates=false \
            -DallowSnapshots=false \
            -DallowDowngrade=false \
            -DgenerateBackupPoms=false \
            -DignoredVersions='.*-M.*,.*-RC.*,.*-alpha.*,.*-beta.*,.*-SNAPSHOT'

          mvn "${COMMON_MVN_ARGS[@]}" \
            versions:update-properties \
            "${COMMON_UPDATE_ARGS[@]}"

          mvn "${COMMON_MVN_ARGS[@]}" \
            versions:update-properties \
            -DincludePlugins=true \
            "${COMMON_UPDATE_ARGS[@]}"

          mvn "${COMMON_MVN_ARGS[@]}" \
            versions:use-latest-releases \
            "${COMMON_UPDATE_ARGS[@]}"

          mvn "${COMMON_MVN_ARGS[@]}" \
            versions:update-child-modules \
            -DgenerateBackupPoms=false

      - name: Show diff after Maven update
        run: |
          git status --short
          git diff -- pom.xml || true

      - name: Resolve/build after version updates
        run: |
          mvn -Dmaven.repo.local="${MAVEN_REPO}" \
            --no-transfer-progress -DskipTests=true -s settings.xml -B clean package

      - name: Commit version updates
        run: |
          if git diff --quiet; then
            echo "No non-major Maven version updates found."
            exit 0
          fi

          git status --short
          git add pom.xml maven-version-updates.txt
          git commit -m "Update non-major Maven versions (${{ needs.Date.outputs.Date }})"
          git push

  CollectM2:
    needs: [ Date, UpdateVers ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAVEN_REPO: ${{ github.workspace }}/.collector-m2/repository
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare isolated Maven repository
        run: |
          rm -rf "${MAVEN_REPO}"
          mkdir -p "${MAVEN_REPO}"

      - name: Build once and populate isolated Maven repository
        run: |
          mvn -Dmaven.repo.local="${MAVEN_REPO}" \
            -DskipTests=true --no-transfer-progress -B -s settings.xml clean package

      - name: Export Maven dependency tree
        run: |
          TREE_MAVEN_REPO="${RUNNER_TEMP}/collector-deptree-m2/repository"
          rm -rf "${TREE_MAVEN_REPO}"
          mkdir -p "${TREE_MAVEN_REPO}"

          mvn -Dmaven.repo.local="${TREE_MAVEN_REPO}" \
            -DskipTests=true --no-transfer-progress -B -s settings.xml \
            -DoutputType=text \
            -DoutputFile="${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt" \
            dependency:tree

          mvn -Dmaven.repo.local="${TREE_MAVEN_REPO}" \
            -DskipTests=true --no-transfer-progress -B -s settings.xml \
            -DoutputType=dot \
            -DoutputFile="${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.dot" \
            dependency:tree

          ls -1sh ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.*

      - name: Upload dependency tree artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}
          path: |
            ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
            ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.dot
          if-no-files-found: error

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b .
          ./syft --version

      - name: Generate SBOM for isolated Maven repository
        run: |
          ./syft dir:"${MAVEN_REPO}" \
            -o cyclonedx-json \
            > ${{ vars.COLLECTOR }}-m2-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.cyclonedx.json

      - name: Upload Maven cache SBOM
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.cyclonedx.json
          path: ${{ vars.COLLECTOR }}-m2-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.cyclonedx.json
          if-no-files-found: error

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b .
          ./grype --version

      - name: Grype scan Maven cache JSON
        if: always()
        run: |
          set +e

          ./grype dir:"${MAVEN_REPO}" \
            -o json \
            > ${{ vars.COLLECTOR }}-m2-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json

          grype_exit=$?
          echo "GRYPE_M2_JSON_EXIT=${grype_exit}" >> "$GITHUB_ENV"

          # Do not fail here. This step is for artifact/report generation.
          exit 0

      - name: Upload Maven cache Grype JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json
          path: ${{ vars.COLLECTOR }}-m2-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json
          if-no-files-found: error

      - name: Generate Maven cache Grype proof report
        if: always()
        run: |
          set +e

          ./grype dir:"${MAVEN_REPO}" -o table \
            > ${{ vars.COLLECTOR }}-m2-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt

          echo "## Grype Results (Isolated Maven Repository) ⚓" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          head -n 250 ${{ vars.COLLECTOR }}-m2-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          total_lines=$(wc -l < ${{ vars.COLLECTOR }}-m2-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt | tr -d ' ')
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Full Maven cache Grype report saved as artifact. Total lines: ${total_lines}_" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Maven cache Grype proof report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}
          path: ${{ vars.COLLECTOR }}-m2-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          if-no-files-found: warn

      - name: Enforce Maven cache Grype severity gate
        run: |
          ./grype dir:"${MAVEN_REPO}" --fail-on high -o table

      - name: TARchive isolated Maven repository
        run: |
          tar -cvzf ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz \
            --exclude='_remote.repositories' -C "${MAVEN_REPO}/.." \
            repository \
            | tee ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt

      - name: List files for debug
        run: |
          ls -lAh ${{ github.workspace }}

      - name: Upload M2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload M2 ToC artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt
          path: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt
          if-no-files-found: error

  Code:
    needs: [ Date, UpdateVers ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Bundle code base
        run: |
          git bundle create --progress ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle --all
          ls -1Ssh *

      - name: Generate Bundle Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle.sha

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle
          path: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle*
          if-no-files-found: error

  CollectBOM:
    needs: [ Date, UpdateVers, CollectM2 ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      MAVEN_REPO: ${{ github.workspace }}/.collector-m2/repository
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Prepare isolated Maven repository
        run: |
          rm -rf "${MAVEN_REPO}"
          mkdir -p "${MAVEN_REPO}"

      - name: Build with Maven and generate CycloneDX BOM
        run: |
          mvn -Dmaven.repo.local="${MAVEN_REPO}" \
            -DskipTests=true -B --no-transfer-progress -s settings.xml \
            clean package cyclonedx:makeAggregateBom

      - name: Generate dependency graph
        run: |
          mvn -Dmaven.repo.local="${MAVEN_REPO}" \
            -DskipTests=true -B --no-transfer-progress -s settings.xml \
            com.github.ferstl:depgraph-maven-plugin:aggregate

      - name: Create BOM ZIP
        run: |
          echo -e "\nTarget Directory Listing"
          ls -lAh target/*

          echo -e "\nTree of Target directory"
          tree target || true

          echo -e "\nZipping BOMs"
          zip -jD ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip \
            target/bom.*

      - name: Upload BOM ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          path: ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          if-no-files-found: error

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5.0.0
        with:
          ignore-maven-wrapper: true
          settings-file: settings.xml

  CollectXSD:
    needs: [ Date ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Collect http://maven.apache.org/xsd
        run: |
          set +e
          wget -np -rN -l 1 --no-verbose http://maven.apache.org/xsd
          case $? in
            0) echo "Success";;
            8) echo "No changes";;
            *) echo "Failed";;
          esac

      - name: Zipup XSDs
        run: |
          cd maven.apache.org
          zip -r ../${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip xsd

      - name: Generate XSD artifact hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip \
          | tee ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip.sha

      - name: Upload XSD artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          path: |
            ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
            ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip.sha
          if-no-files-found: error

  MakeISO:
    runs-on: ubuntu-latest
    needs: [ Date, CollectM2, CollectBOM, CollectXSD, Code ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Install mkisofs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate artifact manifest hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}* \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha

      - name: Upload artifact manifest hash
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha
          path: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha
          if-no-files-found: error

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*

      - name: Make ISO
        run: |
          mkisofs -J -R -v -T -l \
            -V '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -A '${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}' \
            -o ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso \
            ${{ vars.COLLECTOR }}-*.*

      - name: Implant MD5 sum into ISO
        run: |
          implantisomd5 ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso

      - name: Generate ISO Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso.sha

      - name: Show ISO and hash
        run: ls -1Ssh *.iso*

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso
          path: "*.iso*"
          if-no-files-found: error

  VirusScan:
    runs-on: ubuntu-latest
    needs: [ Date, MakeISO ]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          pattern: "*.iso"
          merge-multiple: true

      - name: List files to scan
        run: |
          echo "Files to be scanned:"
          ls -lh

      - name: Scan files for viruses
        id: virus_scan
        uses: hugoalh/scan-virus-ghaction/clamav@v0.20.1
        with:
          clamav_update: true
          found_log: true
          found_summary: true
          statistics_log: true
          statistics_summary: true

      - name: Save scan summary
        if: always()
        run: |
          echo "Virus scan completed" > ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "Scan finished: ${{ steps.virus_scan.outputs.finish }}" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "Viruses found: ${{ steps.virus_scan.outputs.found }}" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "For detailed scan results, check the job logs and step summary." >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt

      - name: Upload virus scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          path: "*-virus-scan-report-*.txt"
          if-no-files-found: warn

  Release:
    runs-on: ubuntu-latest
    needs: [ Date, VirusScan ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [ Date, VirusScan ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out updated branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*
