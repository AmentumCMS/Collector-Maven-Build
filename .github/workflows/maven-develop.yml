# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Maven Collector - Develop
run-name: ${{ github.actor }} is Collecting Maven-ness (Develop) 🚀
on:
  push:
    branches:
      - develop
  workflow_dispatch:
jobs:
  Date:
    runs-on: ubuntu-latest
    outputs:
      Date: ${{ steps.date.outputs.date }}
    steps:
      - name: Get current date
        id: DATE
        run: |
          echo -n "Setting Date in "
          echo "DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "$GITHUB_OUTPUT"
          echo "Values: $(cat $GITHUB_OUTPUT)"
      - name: Display Envars
        run: env

# Update Component Versions
  UpdateVers:
    runs-on: ubuntu-latest
    needs: [ Date ]
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Advance Dependency versions
        run: |
          set +ex
          mvn --no-transfer-progress -DskipTests=true -ssettings.xml -B versions:update-parent
          git commit -am "Update versions (${{ needs.Date.outputs.Date }})"
          git push

# CollectM2 is the most time-consuming step, so we run it in parallel to the BOM collection and XSD collection steps. 
# It also produces the most critical artifact (the .m2 repository) that we want to get scanned as soon as possible, so we prioritize its completion.
  CollectM2:
    needs: [ Date, UpdateVers ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          
      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build once (populate ~/.m2 + generate BOM)
        run: |
          mvn -DskipTests=true --no-transfer-progress -B -s settings.xml \
            package cyclonedx:makeAggregateBom

      - name: Export Maven dependency tree (text + dot)
        run: |
          mvn -DskipTests=true --no-transfer-progress -B -s settings.xml \
            -DoutputType=text \
            -DoutputFile="${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt" \
            dependency:tree

          mvn -DskipTests=true --no-transfer-progress -B -s settings.xml \
            -DoutputType=dot \
            -DoutputFile="${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.dot" \
            dependency:tree

          ls -1sh ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.*

      - name: Upload dependency tree artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}
          path: |
            ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
            ${{ vars.COLLECTOR }}-deptree-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.dot

      - name: TARchive .m2 directory (collector payload)
        run: |
          tar -cvzf ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz \
            --exclude='_remote.repositories' -C ~/.m2 \
            repository \
            | tee ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt

      - name: List Files for Debug
        run: |
          ls -lAh ${{ github.workspace }}

      - name: Upload M2 artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz
          path: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz*
          if-no-files-found: error

      - name: Upload M2 ToC artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt
          path: ${{ vars.COLLECTOR }}-m2-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.tgz.txt
          if-no-files-found: error

  Code:
    needs: [ Date ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup Git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Bundle code base
        run: |
          git bundle create --progress ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle --all
          ls -1Ssh *

      - name: Generate Bundle Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle.sha

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle
          path: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.bundle*
          if-no-files-found: error

  CollectBOM:
    needs: [ Date, CollectM2 ]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
      security-events: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build with Maven
        run: mvn -DskipTests=true -B --no-transfer-progress -s settings.xml
          cyclonedx:makeAggregateBom

      - name: Generate dependency graph
        run: mvn com.github.ferstl:depgraph-maven-plugin:aggregate

      - name: Create BoM ZIP
        run: |
          echo -e "\nTarget Directory Listing"
          ls -lAh target/*
          echo -e "\nTree of Target directory"
          tree target
          echo -e "\nZipping BOMs"
          zip -jD ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip \
            target/bom.*

      - name: Upload BOM ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          path: ${{ vars.COLLECTOR }}-bom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          if-no-files-found: error

      - name: Generate SBOM (Syft) for ~/.m2/repository
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ~/.m2/repository
          format: spdx-json
          output-file: ${{ vars.COLLECTOR }}-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.spdx.json

      - name: Upload SBOM (Syft)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.spdx.json
          path: ${{ vars.COLLECTOR }}-sbom-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.spdx.json
          if-no-files-found: error

      - name: Grype scan (SARIF)
        uses: anchore/scan-action@v7.4.0
        with:
          path: ~/.m2/repository
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          output-file: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sarif

      - name: Upload Grype SARIF
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sarif
          path: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sarif
          if-no-files-found: error

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sarif

      - name: Grype scan (JSON)
        uses: anchore/scan-action@v7.4.0
        with:
          path: ~/.m2/repository
          fail-build: false
          severity-cutoff: high
          output-format: json
          output-file: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json

      - name: Upload Grype JSON
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json
          path: ${{ vars.COLLECTOR }}-grype-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json

      # Human-friendly "proof" report into Step Summary (like your container workflow)
      - name: Generate Grype Proof Report
        if: always()
        run: |
          set +e
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b .
          ./grype --version

          # Table format is easiest to read in summary
          ./grype ~/.m2/repository -o table > grype-report.txt

          echo "## Grype Results (Maven ~/.m2) ⚓" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Avoid mega summaries; keep it readable
          head -n 250 grype-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          total_lines=$(wc -l < grype-report.txt | tr -d ' ')
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Grype report saved as artifact. Total lines: ${total_lines}_" >> $GITHUB_STEP_SUMMARY

      - name: Upload Grype Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidence-grype-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}
          path: grype-report.txt

      # OSV scanning + Summary
      # - name: OSV scan
      #   id: osv
      #   uses: google/osv-scanner-action@v2.3.5
      #   with:
      #     scan-args: >-
      #       --format=json \
      #       --output=${{ vars.COLLECTOR }}-osv-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json

      # - name: Upload OSV JSON
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: ${{ vars.COLLECTOR }}-osv-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json
      #     path: ${{ vars.COLLECTOR }}-osv-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json

      # - name: Publish OSV Summary
      #   if: always()
      #   run: |
      #     set +e
      #     f="${{ vars.COLLECTOR }}-osv-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.json"
      #     if [ ! -f "$f" ]; then
      #       echo "OSV output file not found: $f"
      #       exit 0
      #     fi

      #     echo "## OSV Results (Project / ecosystem scan) 🛡️" >> $GITHUB_STEP_SUMMARY

      #     # Count severities (OSV schema can vary; try best-effort)
      #     echo "" >> $GITHUB_STEP_SUMMARY
      #     echo "**Severity counts (best-effort):**" >> $GITHUB_STEP_SUMMARY
      #     echo '```' >> $GITHUB_STEP_SUMMARY
      #     jq -r '
      #       def sev(x):
      #         (x // "" | ascii_upcase);
      #       [
      #         .. | objects | .severity? // empty
      #       ] | flatten
      #       | map(sev(.))
      #       | reduce .[] as $s ({}; .[$s] = (.[$s] // 0) + 1)
      #       | to_entries
      #       | sort_by(.key)
      #       | .[]
      #       | "\(.key): \(.value)"
      #     ' "$f" 2>/dev/null || echo "Could not parse severities from OSV JSON"
      #     echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@v5.0.0
        with:
          ignore-maven-wrapper: true
          settings-file: settings.xml

  CollectXSD:
    needs: [ Date ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Collect http://maven.apache.org/xsd
        run: |
          set +e
          wget -np -rN -l 1 --no-verbose http://maven.apache.org/xsd
          case $? in
            0) echo "Success";;
            8) echo "No changes";;
            *) echo "Failed";;
          esac

      - name: Zipup XSDs
        run: |
          cd maven.apache.org
          zip -r  ../${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip xsd

      - name: Generate Artifact Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip \
          | tee ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip.sha

      - name: Upload XSD artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          path: ${{ vars.COLLECTOR }}-xsd-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.zip
          if-no-files-found: error

  MakeISO:
    runs-on: ubuntu-latest
    needs: [ Date, CollectM2, CollectBOM, CollectXSD, Code ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Install mkisofs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mkisofs isomd5sum

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate Artifact Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}* \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha

      - name: Upload Artifact sha artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha
          path: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.sha
          if-no-files-found: error

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*

      - name: Make ISO
        run: |
          mkisofs -J -R -v -T -l \
            -V '${{ vars.COLLECTOR }}-${{ needs.Date.outputs.Date }}' \
            -A '${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}' \
            -o ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso \
            ${{ vars.COLLECTOR }}-*.*

      - name: Implant MD5 sum into iso
        run: implantisomd5 ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso

      - name: Generate ISO Hash
        run: |
          sha256sum -b ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso \
          | tee ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso.sha

      - name: Show ISO & Hash
        run: ls -1Ssh *.iso*

      - name: Upload iso artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.iso
          path: "*.iso*"
          if-no-files-found: error

  VirusScan:
    runs-on: ubuntu-latest
    needs: [ Date, MakeISO ]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v8
        with:
          pattern: "*.iso"

      # - name: Download TGZ artifacts
      #   uses: actions/download-artifact@v8
      #   with:
      #     merge-multiple: true
      #     pattern: "*-${{ needs.Date.outputs.Date }}.tgz"

      - name: List files to scan
        run: |
          echo "Files to be scanned:"
          ls -lh

      - name: Scan files for viruses
        id: virus_scan
        uses: hugoalh/scan-virus-ghaction/clamav@v0.20.1
        with:
          clamav_update: true
          found_log: true
          found_summary: true
          statistics_log: true
          statistics_summary: true

      - name: Save scan summary
        if: always()
        run: |
          echo "Virus scan completed" > ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "Scan finished: ${{ steps.virus_scan.outputs.finish }}" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "Viruses found: ${{ steps.virus_scan.outputs.found }}" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "" >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          echo "For detailed scan results, check the job logs and step summary." >> ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt

      - name: Upload virus scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ vars.COLLECTOR }}-virus-scan-report-${{ github.ref_name }}-${{ needs.Date.outputs.Date }}.txt
          path: "*-virus-scan-report-*.txt"
          if-no-files-found: warn

  Release:
    runs-on: ubuntu-latest
    needs: [ Date, VirusScan ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*

  Sharepoint:
    runs-on: ubuntu-latest
    needs: [ Date, VirusScan ]
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: ls -1Ssh ${{ vars.COLLECTOR }}-*.*
